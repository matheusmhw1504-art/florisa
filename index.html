<!doctype html>
<html lang="pt-BR">
<head>
<!--
  Floricultura Florisa — protótipo da loja online (Veyroni, 16/10/2026)
  Protótipo navegável para apresentação. Pagamento, login e rastreio são simulados no navegador.

  [CONFIRMAR] antes de virar sistema:
   1. Catálogo: os 6 produtos sem "exemplo" vêm do Agora Menu (16/10/2026). Os marcados exemplo:true
      usam fotos reais da loja, mas nome e preço são provisórios. Pedir a lista completa (nome, preço, fotos).
   2. Adicionais (bombons, pelúcia, balão): preços de exemplo.
   3. Taxas de entrega por bairro: todas em "R$ x".
   4. Parcelamento no cartão (usado: até 3x sem juros) e chave Pix.
   5. Galeria do produto: só existe 1 foto por produto; as outras vistas são recortes da mesma foto.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja | Floricultura Florisa — Jaraguá do Sul</title>
<meta name="theme-color" content="#0C3A21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ================= TOKENS ================= */
:root{
  --mata:#0C3A21;          /* verde do logo, escurecido: fundo das partes fortes */
  --mata-2:#14522F;
  --creme:#FAF6EE;         /* fundo claro */
  --creme-2:#F1EBDD;       /* rodapé dos cartões */
  --papel:#FFFDF8;
  --sol:#F2A900;           /* amarelo do logo: estrelas e detalhes */
  --tinta:#0C3A21;         /* títulos no creme */
  --texto:#3E4A42;
  --texto-claro:rgba(250,246,238,.8);
  --linha:rgba(12,58,33,.14);
  --linha-clara:rgba(250,246,238,.26);
  --brilho:radial-gradient(closest-side, rgba(34,124,70,.55), rgba(20,82,47,.25) 62%, transparent 100%);

  --f-titulo:"Lora", Georgia, serif;
  --f-texto:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-xs:.8125rem; --t-s:.9375rem; --t-m:1rem;
  --t-h2:clamp(2.25rem, 1.6rem + 2.6vw, 3.75rem);
  --t-h1:clamp(2.75rem, 1.4rem + 5.2vw, 5.4rem);

  --largura:75rem;
  --raio:14px; --raio-g:24px;
  --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
}

/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--creme);color:var(--texto);font:400 var(--t-m)/1.6 var(--f-texto);overflow-x:clip}
::selection{background:var(--sol);color:var(--mata)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:var(--f-titulo);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em;text-wrap:balance;color:var(--tinta)}
h1 em,h2 em{font-style:normal}
.k,.produto .tag{letter-spacing:.1em;text-transform:uppercase;font-weight:600}
p{margin:0;text-wrap:pretty}
.wrap{width:min(100% - 2rem, var(--largura));margin-inline:auto}
.num{font-variant-numeric:tabular-nums lining-nums}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.pular{position:absolute;left:1rem;top:-4rem;background:var(--papel);color:var(--mata);padding:.6rem 1rem;border-radius:8px;z-index:100}
.pular:focus{top:1rem}
:focus-visible{outline:2px solid var(--sol);outline-offset:3px;border-radius:6px}
.claro :focus-visible{outline-color:var(--mata)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.75rem 1.4rem;border-radius:10px;
  font:500 var(--t-s)/1.2 var(--f-texto);text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;
  transition:transform 160ms var(--ease-out), background-color 200ms ease, color 200ms ease, border-color 200ms ease;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-creme{background:var(--creme);color:var(--mata)}
.btn-contorno{border-color:var(--linha-clara);color:var(--creme)}
.btn-mata{background:var(--mata);color:var(--creme)}
.btn-contorno-escuro{border-color:rgba(12,58,33,.35);color:var(--mata)}
@media (hover:hover) and (pointer:fine){
  .btn-creme:hover{background:#fff}
  .btn-contorno:hover{border-color:var(--creme);background:rgba(250,246,238,.07)}
  .btn-mata:hover{background:var(--mata-2)}
  .btn-contorno-escuro:hover{border-color:var(--mata)}
}


/* ================= LOJA ================= */
body{background:var(--creme)}
input,select,button,textarea{font:inherit;color:inherit}
.topo{position:sticky;top:0;z-index:50;background:rgba(250,246,238,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1rem;min-height:72px}
.topo .marca img{height:38px;width:auto}
.busca{position:relative;max-width:30rem;width:100%;justify-self:center}
.busca input{width:100%;min-height:44px;border:1px solid var(--linha);background:var(--papel);border-radius:10px;padding:.55rem .9rem .55rem 2.5rem;font-size:16px}
.busca input:focus{outline:2px solid var(--mata);outline-offset:1px}
.busca svg{position:absolute;left:.8rem;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--texto)}
.acoes-topo{display:flex;gap:6px;align-items:center}
.icone-b{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-width:44px;height:44px;padding:0 .8rem;border:1px solid var(--linha);border-radius:10px;background:transparent;color:var(--mata);cursor:pointer;text-decoration:none;font-size:var(--t-s);font-weight:500;transition:border-color 200ms ease, transform 160ms var(--ease-out)}
.icone-b:active{transform:scale(.97)}
.icone-b svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.icone-b:hover{border-color:var(--mata)}}
.contador{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--sol);color:var(--mata);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.contador[hidden]{display:none}
.contador.pula{animation:pula 450ms cubic-bezier(.34,1.56,.64,1)}
@keyframes pula{40%{transform:scale(1.35)}}
@media (max-width:720px){
  .topo .wrap{grid-template-columns:auto 1fr;padding-block:.6rem;gap:.6rem}
  .busca{grid-column:1 / -1;grid-row:2;max-width:none}
  .acoes-topo{justify-self:end}
  .icone-b .txt{display:none}
  .topo .marca img{height:32px}
}
.aviso-demo{background:var(--mata);color:var(--texto-claro);font-size:var(--t-xs);text-align:center;padding:.45rem 1rem}
.aviso-demo b{color:var(--creme);font-weight:600}

main{min-height:70vh}
.tela{padding:clamp(1.5rem,4vw,2.75rem) 0 5rem;animation:entraTela 500ms var(--ease-out) both}
@keyframes entraTela{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.migalha{display:flex;flex-wrap:wrap;gap:.4rem;font-size:var(--t-xs);color:var(--texto);margin-bottom:1rem}
.migalha a{color:var(--mata);text-underline-offset:3px}
h1.titulo{font-size:clamp(2rem,1.4rem + 2vw,3rem)}
.sub-t{margin-top:.4rem;color:var(--texto)}

/* catálogo */
.cat-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(1.5rem,3vw,2.75rem);margin-top:1.75rem;align-items:start}
.filtros{position:sticky;top:92px;display:grid;gap:1.75rem}
.filtros h2{font-size:1.15rem;margin-bottom:.6rem}
.op-lista{display:grid;gap:2px}
.op{display:flex;justify-content:space-between;align-items:center;gap:.5rem;width:100%;min-height:42px;padding:.45rem .7rem;border-radius:9px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--texto);transition:background-color 160ms ease}
.op .n{font-size:var(--t-xs);opacity:.7}
.op[aria-pressed="true"]{background:var(--mata);color:var(--creme)}
@media (hover:hover) and (pointer:fine){.op:not([aria-pressed="true"]):hover{background:var(--creme-2)}}
.faixas{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--linha);background:var(--papel);cursor:pointer;font-size:var(--t-s);transition:border-color 160ms ease, background-color 160ms ease}
.chip[aria-pressed="true"]{background:var(--mata);border-color:var(--mata);color:var(--creme)}
.limpar{border:0;background:none;color:var(--mata);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:.4rem 0;justify-self:start;font-size:var(--t-s)}
.barra-cat{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.barra-cat .qtd{font-size:var(--t-s);color:var(--texto)}
.barra-cat select{min-height:42px;border:1px solid var(--linha);border-radius:9px;background:var(--papel);padding:.4rem .7rem;font-size:15px}
.btn-filtros{display:none}
.grade{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.7rem,1.6vw,1.25rem)}
.card{display:flex;flex-direction:column;height:100%;background:var(--papel);border-radius:var(--raio);overflow:hidden;border:1px solid rgba(12,58,33,.07);animation:entraCard 600ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes entraCard{from{opacity:0;transform:translateY(14px)}}
.card a.foto{position:relative;display:block;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform 600ms var(--ease-out)}
.card .selo-c{position:absolute;left:10px;top:10px;background:var(--mata);color:var(--creme);font-size:.6875rem;font-weight:600;padding:.25rem .5rem;border-radius:6px}
.card .ex{position:absolute;right:10px;top:10px;background:rgba(250,246,238,.92);color:var(--mata);font-size:.625rem;padding:.2rem .45rem;border-radius:6px}
.card .info{padding:.85rem 1rem 1rem;display:grid;gap:.3rem;flex:1;align-content:start}
.card .cat{font-size:var(--t-xs);color:var(--texto)}
.card h3{font-size:1.1rem;line-height:1.2}
.card h3 a{text-decoration:none}
.card .pe{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:auto;padding-top:.5rem}
.preco{font:600 1.3rem/1 var(--f-titulo);color:var(--mata)}
.add-mini{width:42px;height:42px;border-radius:10px;border:1px solid rgba(12,58,33,.3);background:transparent;color:var(--mata);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color 200ms ease, color 200ms ease, transform 160ms var(--ease-out)}
.add-mini svg{width:20px;height:20px}
.add-mini:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.card:hover img{transform:scale(1.05)}.add-mini:hover{background:var(--mata);color:var(--creme)}}
.vazio{padding:3rem 1rem;text-align:center;color:var(--texto);background:var(--papel);border-radius:var(--raio)}
.vazio h2{font-size:1.5rem;margin-bottom:.5rem}
.vazio .btn{margin-top:1.25rem}
@media (max-width:960px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .cat-grid{grid-template-columns:1fr}
  .btn-filtros{display:inline-flex}
  .filtros{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;background:var(--creme);border-radius:20px 20px 0 0;padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;box-shadow:0 -20px 50px -20px rgba(5,25,14,.5);transform:translateY(105%);transition:transform 380ms var(--ease-drawer);visibility:hidden}
  .filtros.aberto{transform:none;visibility:visible}
  .filtros .fechar-f{display:flex}
}
.fechar-f{display:none;justify-content:space-between;align-items:center}
.fechar-f h2{margin:0}
.veu-f{position:fixed;inset:0;z-index:79;background:rgba(5,25,14,.4);opacity:0;pointer-events:none;transition:opacity 300ms ease}
.veu-f.on{opacity:1;pointer-events:auto}

/* produto */
.prod{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
.galeria{display:grid;gap:10px;position:sticky;top:92px}
.galeria .grande{border-radius:var(--raio-g);overflow:hidden;background:var(--papel);aspect-ratio:1}
.galeria .grande img{width:100%;height:100%;object-fit:cover;transition:transform 700ms var(--ease-out), opacity 300ms ease}
.miniaturas-p{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.miniaturas-p button{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--papel);aspect-ratio:1}
.miniaturas-p button[aria-pressed="true"]{border-color:var(--mata)}
.miniaturas-p img{width:100%;height:100%;object-fit:cover}
.prod .cat{font-size:var(--t-s);color:var(--texto)}
.prod h1{font-size:clamp(1.9rem,1.3rem + 2vw,2.8rem);margin-top:.3rem}
.prod .preco-g{font:600 2rem/1 var(--f-titulo);color:var(--mata);margin-top:1rem;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.prod .preco-g small{font:400 var(--t-s) var(--f-texto);color:var(--texto)}
.prod .desc{margin-top:1rem;max-width:34rem}
.bloco{margin-top:1.75rem;padding-top:1.5rem;border-top:1px solid var(--linha)}
.bloco h2{font-size:1.2rem;margin-bottom:.8rem}
.extras{display:grid;gap:8px}
.extra{display:grid;grid-template-columns:auto 52px 1fr auto;align-items:center;gap:.8rem;padding:.6rem .8rem;border:1px solid var(--linha);border-radius:12px;background:var(--papel);cursor:pointer;transition:border-color 160ms ease}
.extra:has(input:checked){border-color:var(--mata);box-shadow:inset 0 0 0 1px var(--mata)}
.extra input{width:20px;height:20px;accent-color:var(--mata)}
.extra .ic-ex{width:52px;height:52px;border-radius:10px;background:var(--creme-2);display:flex;align-items:center;justify-content:center;color:var(--mata)}
.extra .ic-ex svg{width:24px;height:24px}
.extra b{font-weight:600;color:var(--mata)}
.extra span small{display:block;font-size:var(--t-xs);color:var(--texto)}
.comprar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem;align-items:center}
.qtd-s{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:10px;background:var(--papel);height:48px}
.qtd-s button{width:44px;height:100%;border:0;background:none;cursor:pointer;font-size:1.2rem;color:var(--mata)}
.qtd-s span{min-width:2ch;text-align:center;font-weight:600}
.comprar .btn{flex:1 1 180px}
.entrega-info{display:grid;gap:.7rem;margin-top:1.5rem;font-size:var(--t-s)}
.entrega-info div{display:flex;gap:.7rem;align-items:flex-start}
.entrega-info svg{width:20px;height:20px;flex:none;color:var(--mata);margin-top:.1rem}
.relacionados{margin-top:4rem}
.relacionados h2{font-size:1.6rem;margin-bottom:1.25rem}
.relacionados .grade{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.prod{grid-template-columns:1fr}.galeria{position:static}.relacionados .grade{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* carrinho */
.carrinho{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(1.5rem,3vw,2.5rem);margin-top:1.5rem;align-items:start}
.itens{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:1rem;align-items:start;background:var(--papel);border-radius:var(--raio);padding:.8rem;border:1px solid rgba(12,58,33,.07)}
.item img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.item h3{font-size:1.1rem}
.item .ad{font-size:var(--t-xs);color:var(--texto);margin-top:.25rem}
.item .linha-i{display:flex;align-items:center;gap:.75rem;margin-top:.6rem;flex-wrap:wrap}
.item .qtd-s{height:40px}
.item .qtd-s button{width:38px}
.remover{border:0;background:none;color:var(--texto);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:var(--t-xs);min-height:40px}
.item .preco{font-size:1.15rem;white-space:nowrap}
.resumo{position:sticky;top:92px;background:var(--papel);border-radius:var(--raio-g);padding:1.4rem;border:1px solid rgba(12,58,33,.08)}
.resumo h2{font-size:1.35rem;margin-bottom:1rem}
.linhas{display:grid;gap:.55rem;font-size:var(--t-s)}
.linhas div{display:flex;justify-content:space-between;gap:1rem}
.linhas .total{border-top:1px solid var(--linha);padding-top:.8rem;margin-top:.3rem;font-size:1rem;font-weight:600;color:var(--mata)}
.linhas .total b{font:600 1.5rem/1 var(--f-titulo)}
.resumo .btn{width:100%;margin-top:1.1rem}
.resumo .nota{font-size:var(--t-xs);color:var(--texto);margin-top:.8rem;text-align:center}
.mini-itens{display:grid;gap:.7rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--linha)}
.mini-itens div{display:grid;grid-template-columns:48px 1fr auto;gap:.7rem;align-items:center;font-size:var(--t-s)}
.mini-itens img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.mini-itens small{display:block;font-size:var(--t-xs);color:var(--texto)}
@media (max-width:860px){.carrinho{grid-template-columns:1fr}.resumo{position:static}}

/* checkout */
.passo{background:var(--papel);border-radius:var(--raio-g);padding:clamp(1.1rem,2.5vw,1.6rem);border:1px solid rgba(12,58,33,.08)}
.passos{display:grid;gap:12px}
.passo h2{display:flex;align-items:center;gap:.7rem;font-size:1.3rem}
.passo h2 .num{width:30px;height:30px;border-radius:50%;background:var(--mata);color:var(--creme);font:600 .9rem/30px var(--f-texto);text-align:center;flex:none}
.passo .cab-p{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.campos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.8rem;margin-top:1.1rem}
.campo{grid-column:span 6;display:grid;gap:.35rem}
.campo.c3{grid-column:span 3}.campo.c2{grid-column:span 2}.campo.c4{grid-column:span 4}
.campo label{font-size:var(--t-xs);font-weight:600;color:var(--mata)}
.campo input,.campo select,.campo textarea{min-height:46px;border:1px solid rgba(12,58,33,.22);border-radius:10px;background:#fff;padding:.55rem .8rem;font-size:16px;width:100%}
.campo textarea{min-height:84px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--mata);outline-offset:1px;border-color:transparent}
.campo.erro input,.campo.erro select{border-color:#B3261E;background:#FFF8F7}
.campo .msg{font-size:var(--t-xs);color:#B3261E}
@media (max-width:560px){.campo.c3,.campo.c2,.campo.c4{grid-column:span 6}}
.alterna{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:1.1rem}
.opcao{position:relative;display:grid;gap:.2rem;padding:.85rem 1rem;border:1px solid rgba(12,58,33,.22);border-radius:12px;background:#fff;cursor:pointer;transition:border-color 160ms ease, box-shadow 160ms ease}
.opcao input{position:absolute;opacity:0;pointer-events:none}
.opcao b{font-weight:600;color:var(--mata);display:flex;align-items:center;gap:.5rem}
.opcao b svg{width:18px;height:18px}
.opcao small{font-size:var(--t-xs);color:var(--texto)}
.opcao:has(input:checked){border-color:var(--mata);box-shadow:inset 0 0 0 1px var(--mata);background:#F6F9F4}
.opcao:has(input:focus-visible){outline:2px solid var(--mata);outline-offset:2px}
.opcao[hidden]{display:none}
.toggle{display:flex;align-items:center;gap:.7rem;cursor:pointer;font-weight:500;color:var(--mata);margin-top:1rem}
.toggle input{appearance:none;width:44px;height:26px;border-radius:13px;background:rgba(12,58,33,.2);position:relative;cursor:pointer;transition:background-color 200ms ease;flex:none}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform 240ms var(--ease-out);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--mata)}
.toggle input:checked::after{transform:translateX(18px)}
.abre{display:grid;grid-template-rows:0fr;transition:grid-template-rows 350ms var(--ease-out)}
.abre.on{grid-template-rows:1fr}
.abre > div{overflow:hidden}
.link-b{border:0;background:none;color:var(--mata);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:var(--t-s);padding:.3rem 0}
.logado{display:flex;align-items:center;gap:.6rem;font-size:var(--t-s);margin-top:1rem;padding:.7rem .9rem;background:#F6F9F4;border-radius:10px}
.logado svg{width:18px;height:18px;color:var(--mata)}

/* pedido */
.conf{max-width:46rem;margin:0 auto}
.conf .topo-c{text-align:center}
.marca-ok{width:64px;height:64px;border-radius:50%;background:var(--mata);color:var(--creme);display:inline-flex;align-items:center;justify-content:center;animation:ok 700ms cubic-bezier(.34,1.56,.64,1) both}
.marca-ok svg{width:30px;height:30px}
@keyframes ok{from{transform:scale(.4);opacity:0}}
.conf h1{margin-top:1rem;font-size:clamp(1.9rem,1.3rem + 2vw,2.6rem)}
.conf .nped{margin-top:.5rem;color:var(--texto)}
.conf .nped b{color:var(--mata)}
.cartao-c{background:var(--papel);border-radius:var(--raio-g);padding:clamp(1.1rem,2.5vw,1.6rem);border:1px solid rgba(12,58,33,.08);margin-top:1.25rem}
.cartao-c h2{font-size:1.25rem;margin-bottom:1rem}
.pix{display:grid;grid-template-columns:180px minmax(0,1fr);gap:1.25rem;align-items:center}
.pix .qr{width:180px;height:180px;background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px}
.pix .qr svg{width:100%;height:100%}
.copia{display:flex;gap:6px;margin-top:.8rem}
.copia input{flex:1;min-width:0;min-height:44px;border:1px solid var(--linha);border-radius:9px;padding:.4rem .7rem;font-size:13px;background:#fff;color:var(--texto)}
.expira{font-size:var(--t-xs);color:var(--texto);margin-top:.6rem}
@media (max-width:560px){.pix{grid-template-columns:1fr;justify-items:center;text-align:center}}
.linha-tempo{list-style:none;margin:0;padding:0;display:grid;gap:0}
.etapa{display:grid;grid-template-columns:32px 1fr;gap:.9rem;position:relative;padding-bottom:1.4rem}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--linha)}
.etapa:last-child::before{display:none}
.etapa.feita::before{background:var(--mata)}
.etapa .bola{width:32px;height:32px;border-radius:50%;border:2px solid var(--linha);background:var(--papel);display:flex;align-items:center;justify-content:center;color:var(--creme);transition:background-color 400ms ease, border-color 400ms ease}
.etapa .bola svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:opacity 300ms ease, transform 400ms cubic-bezier(.34,1.56,.64,1)}
.etapa.feita .bola{background:var(--mata);border-color:var(--mata)}
.etapa.feita .bola svg{opacity:1;transform:none}
.etapa.atual .bola{border-color:var(--mata);box-shadow:0 0 0 5px rgba(12,58,33,.12)}
.etapa h3{font-size:1.1rem;line-height:32px}
.etapa p{font-size:var(--t-s);color:var(--texto)}
.etapa:not(.feita):not(.atual) h3{color:rgba(12,58,33,.45)}
.demo{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-top:1.25rem;padding:.7rem .9rem;border:1px dashed rgba(12,58,33,.3);border-radius:10px;font-size:var(--t-xs)}
.busca-ped{max-width:30rem;margin:1.5rem auto 0}
.lista-ped{list-style:none;margin:1.5rem 0 0;padding:0;display:grid;gap:8px}
.lista-ped a{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.9rem 1rem;background:var(--papel);border-radius:12px;text-decoration:none;border:1px solid rgba(12,58,33,.08)}
.lista-ped small{display:block;color:var(--texto);font-size:var(--t-xs)}
.status-t{font-size:var(--t-xs);font-weight:600;padding:.25rem .55rem;border-radius:6px;background:#F6F9F4;color:var(--mata);white-space:nowrap}

/* modal + aviso */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(5,25,14,.45);opacity:0;pointer-events:none;transition:opacity 250ms ease}
.modal.on{opacity:1;pointer-events:auto}
.modal .caixa{width:min(420px,100%);background:var(--creme);border-radius:var(--raio-g);padding:1.5rem;transform:translateY(12px) scale(.98);transition:transform 300ms var(--ease-out);box-shadow:0 30px 70px -30px rgba(5,25,14,.7)}
.modal.on .caixa{transform:none}
.modal h2{font-size:1.5rem}
.modal p{font-size:var(--t-s);margin-top:.4rem}
.modal .btn{width:100%;margin-top:1rem}
.modal .fechar{float:right;border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--mata);width:40px;height:40px;margin:-.5rem -.5rem 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:130;display:flex;align-items:center;gap:1rem;background:var(--mata);color:var(--creme);padding:.6rem .6rem .6rem 1rem;border-radius:12px;box-shadow:0 20px 40px -16px rgba(5,25,14,.7);transform:translate(-50%,140%);transition:transform 380ms var(--ease-drawer);font-size:var(--t-s);max-width:calc(100vw - 2rem)}
.toast.on{transform:translate(-50%,0)}
.toast img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.toast a{color:var(--mata);background:var(--creme);padding:.5rem .8rem;border-radius:8px;text-decoration:none;font-weight:600;white-space:nowrap}
.rodape{border-top:1px solid var(--linha);padding:2rem 0;font-size:var(--t-xs);color:var(--texto)}
.rodape .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem}
.rodape a{color:var(--mata)}
@media (prefers-reduced-motion:reduce){.tela,.card,.marca-ok{animation:none}.contador[hidden]{display:none}
.contador.pula{animation:none}}
</style>
</head>

    var r = PRODUTOS.filter(function (p) {
      if (filtro.cat && p.cat !== filtro.cat) return false;
      if (f && (p.preco < f.min || p.preco >= f.max)) return false;
      if (b) { var t = (p.nome + " " + p.desc + " " + catNome(p.cat)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); if (t.indexOf(b) < 0) return false; }
      return true;
    });
    if (filtro.ordem === "menor") r.sort(function (a, b) { return a.preco - b.preco; });

        var ped = { n: n, data: Date.now(), itens: carrinho.slice(), subtotal: subtotal(), modo: modo(), pag: pag(), pago: pag() === "cartao", etapa: pag() === "pix" ? -1 : 0, nome: $("#nome").value, tel: $("#tel").value,
          dest: $("#presente").checked ? { nome: $("#dNome").value, tel: $("#dTel").value } : null, end: modo() === "entrega" ? { rua: $("#rua").value, numero: $("#numero").value, bairro: $("#bairro").value, data: $("#data").value } : null, parc: $("#parc").value };
        pedidos.unshift(ped); LS.set("pedidos", pedidos);
        if (!usuario) { usuario = null; } else { usuario.nome = usuario.nome || ped.nome; LS.set("usuario", usuario); }
        carrinho = []; salvaC();
        location.hash = "#/pedido/" + n;
      }, 900);
    };
  }

  /* ---------- Pedido / acompanhar ---------- */
  function qr(seed) {
    var n = 25, s = seed, cells = "";
    var rnd = function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    var olho = function (x, y) { return '<rect x="' + x + '" y="' + y + '" width="7" height="7" fill="#0C3A21"/><rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#fff"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#0C3A21"/>'; };
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) { var noOlho = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16); if (!noOlho && rnd() > .52) cells += 'M' + x + ' ' + y + 'h1v1h-1z'; }
    return '<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="QR code do Pix (simulado)"><path d="' + cells + '" fill="#0C3A21"/>' + olho(0, 0) + olho(18, 0) + olho(0, 18) + '</svg>';
  }
  function etapasDe(p) { return p.modo === "retirada" ? ETAPAS_R : ETAPAS_E; }
  function telaPedido(n) {
    var p = pedidos.filter(function (x) { return x.n === n; })[0]; if (!p) { telaAcompanhar("Pedido não encontrado."); return; }
    var et = etapasDe(p), total = brl(p.subtotal) + (p.modo === "entrega" ? " + entrega R$ x" : "");
    var pixPendente = p.pag === "pix" && !p.pago;
    var codigo = "00020126580014BR.GOV.BCB.PIX0136" + CONFIG.pixChave + "5204000053039865802BR5925FLORICULTURA FLORISA6013JARAGUA DO SUL62070503" + p.n + "6304A1B2";
    app.innerHTML = '<section class="tela"><div class="wrap conf"><div class="topo-c">' + (pixPendente ? "" : '<span class="marca-ok">' + ic("i-check") + '</span>') +
      '<h1>' + (pixPendente ? "Falta só o Pix" : "Pedido confirmado") + '</h1><p class="nped">Pedido <b class="num">nº ' + p.n + '</b> · ' + total + (p.pag === "cartao" ? " · cartão em " + p.parc + "x" : "") + '</p></div>' +
      (pixPendente ? '<div class="cartao-c"><h2>Pague com Pix para confirmar</h2><div class="pix"><div class="qr">' + qr(+p.n) + '</div><div><p>Abra o app do seu banco, escolha Pix e leia o QR code. Ou copie o código:</p><div class="copia"><input id="pixCod" readonly value="' + codigo + '" aria-label="Código Pix copia e cola"><button class="btn btn-mata" type="button" id="copiar">Copiar</button></div><p class="expira">O código vale por 30 minutos.</p><button class="btn btn-contorno-escuro" type="button" id="jaPaguei" style="margin-top:1rem">Já paguei</button></div></div></div>' : "") +
      '<div class="cartao-c"><h2>Acompanhe seu pedido</h2><ol class="linha-tempo">' + et.map(function (e, i) { var c = i < p.etapa ? "feita" : i === p.etapa ? "feita atual" : ""; if (i === p.etapa && i === et.length - 1) c = "feita"; return '<li class="etapa ' + c + '"><span class="bola">' + ic("i-check") + '</span><div><h3>' + e[0] + '</h3>' + (i <= p.etapa ? '<p>' + e[1] + '</p>' : "") + '</div></li>'; }).join("") + '</ol>' +
      (p.etapa >= 0 && p.etapa < et.length - 1 ? '<div class="demo"><span>Demonstração: na loja, a equipe avança as etapas.</span><button class="link-b" type="button" id="prox">Simular próxima etapa</button></div>' : "") + '</div>' +
      '<div class="cartao-c"><h2>Resumo</h2><div class="mini-itens">' + p.itens.map(function (i) { var pr = prod(i.id); return '<div><img src="' + IMG[pr.img] + '" alt=""><span>' + i.q + '× ' + esc(pr.nome) + (i.extras.length ? '<small>Com ' + nomesExtras(i) + '</small>' : "") + '</span><span class="num">' + brl(itemTotal(i)) + '</span></div>'; }).join("") + '</div>' +
      '<div class="linhas">' + (p.dest ? '<div><span>Para</span><span>' + esc(p.dest.nome) + '</span></div>' : "") + (p.end ? '<div><span>Entrega</span><span style="text-align:right">' + esc(p.end.rua + ", " + p.end.numero + " · " + p.end.bairro) + '<br>' + p.end.data.split("-").reverse().join("/") + '</span></div>' : '<div><span>Retirada</span><span>' + CONFIG.endereco + '</span></div>') + '<div class="total"><span>Total</span><b class="num">' + total + '</b></div></div></div>' +
      '<p style="text-align:center;margin-top:1.5rem"><a class="btn btn-contorno-escuro" href="#/catalogo">Voltar ao catálogo</a></p></div></section>';
    var salva = function () { LS.set("pedidos", pedidos); telaPedido(n); };
    var cp = $("#copiar"); if (cp) cp.onclick = function () { var i = $("#pixCod"); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand("copy"); } cp.textContent = "Copiado"; };
    var jp = $("#jaPaguei"); if (jp) jp.onclick = function () { jp.disabled = true; jp.textContent = "Confirmando…"; setTimeout(function () { p.pago = true; p.etapa = 0; salva(); }, 1100); };
    var px = $("#prox"); if (px) px.onclick = function () { p.etapa = Math.min(et.length - 1, p.etapa + 1); salva(); };
  }
  function nomeEtapa(p) { return p.etapa < 0 ? "Aguardando Pix" : etapasDe(p)[p.etapa][0]; }
  function telaAcompanhar(msg) {
    var meus = usuario ? pedidos.filter(function (p) { return p.tel.replace(/\D/g, "") === usuario.tel.replace(/\D/g, ""); }) : [];
    app.innerHTML = '<section class="tela"><div class="wrap conf"><div class="topo-c"><h1>Acompanhar pedido</h1><p class="nped">Digite o número do pedido que enviamos no WhatsApp.</p></div>' +
      '<form class="busca-ped" id="fBusca"><div class="campos"><div class="campo c4"><label for="nPed">Número do pedido</label><input id="nPed" inputmode="numeric" placeholder="ex.: 4821"><span class="msg">' + (msg || "") + '</span></div><div class="campo c2" style="align-self:end"><button class="btn btn-mata" type="submit">Ver pedido</button></div></div></form>' +
      (usuario ? '<h2 style="margin-top:2.5rem;font-size:1.4rem">Meus pedidos</h2>' + (meus.length ? '<ul class="lista-ped">' + meus.map(function (p) { return '<li><a href="#/pedido/' + p.n + '"><span><b class="num">nº ' + p.n + '</b><small>' + new Date(p.data).toLocaleDateString("pt-BR") + ' · ' + p.itens.length + (p.itens.length > 1 ? " itens" : " item") + '</small></span><span class="status-t">' + nomeEtapa(p) + '</span></a></li>'; }).join("") + '</ul>' : '<p class="sub-t">Nenhum pedido com este telefone ainda.</p>') : '<p class="sub-t" style="text-align:center;margin-top:2rem">Tem conta? <button class="link-b" type="button" id="entrarAc">Entre para ver todos os seus pedidos</button></p>') + '</div></section>';
    $("#fBusca").onsubmit = function (e) { e.preventDefault(); var v = $("#nPed").value.trim(); if (pedidos.some(function (p) { return p.n === v; })) location.hash = "#/pedido/" + v; else telaAcompanhar("Não achamos esse número. Confira no WhatsApp."); };
    var ea = $("#entrarAc"); if (ea) ea.onclick = function () { abreLogin(function () { telaAcompanhar(); }); };
  }

  /* ---------- Login opcional (simulado) ---------- */
  var modal = $("#modal"), caixa = $("#mCaixa");
  function fecha() { modal.classList.remove("on"); }
  modal.onclick = function (e) { if (e.target === modal) fecha(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") fecha(); });
  function abreLogin(depois) {
    caixa.innerHTML = '<button class="fechar" type="button" aria-label="Fechar">×</button><h2 id="mTit">Entrar</h2><p>Com conta, seus dados já vêm preenchidos e você vê todos os pedidos. Comprar sem conta também funciona.</p><form id="fLog" novalidate><div class="campos"><div class="campo"><label for="lTel">WhatsApp</label><input id="lTel" type="tel" inputmode="tel" placeholder="(47) 9 0000-0000"><span class="msg"></span></div></div><button class="btn btn-mata" type="submit">Receber código no WhatsApp</button></form>';
    modal.classList.add("on"); setTimeout(function () { $("#lTel").focus(); }, 50);
    caixa.querySelector(".fechar").onclick = fecha;
    $("#fLog").onsubmit = function (e) {
      e.preventDefault(); var tel = $("#lTel").value;
      if (tel.replace(/\D/g, "").length < 10) { var c = $("#lTel").closest(".campo"); c.classList.add("erro"); c.querySelector(".msg").textContent = "Informe o telefone com DDD"; return; }
      caixa.innerHTML = '<button class="fechar" type="button" aria-label="Fechar">×</button><h2 id="mTit">Digite o código</h2><p>Enviamos 4 números para ' + esc(tel) + '. Neste protótipo, qualquer código serve.</p><form id="fCod" novalidate><div class="campos"><div class="campo"><label for="lCod">Código</label><input id="lCod" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="one-time-code"></div></div><button class="btn btn-mata" type="submit">Entrar</button></form>';
      caixa.querySelector(".fechar").onclick = fecha; $("#lCod").focus();
      $("#fCod").onsubmit = function (e2) { e2.preventDefault(); var ant = pedidos.filter(function (p) { return p.tel.replace(/\D/g, "") === tel.replace(/\D/g, ""); })[0]; usuario = { tel: tel, nome: ant ? ant.nome : "" }; LS.set("usuario", usuario); fecha(); conta(); if (depois) depois(); };
    };
  }
  function conta() { $("#txtConta").textContent = usuario ? (usuario.nome ? usuario.nome.split(" ")[0] : "Minha conta") : "Entrar"; }
  $("#btnConta").onclick = function () {
    if (!usuario) { abreLogin(); return; }
    caixa.innerHTML = '<button class="fechar" type="button" aria-label="Fechar">×</button><h2 id="mTit">Minha conta</h2><p>' + esc(usuario.nome || "") + ' · ' + esc(usuario.tel) + '</p><a class="btn btn-mata" href="#/acompanhar" id="mPed">Meus pedidos</a><button class="btn btn-contorno-escuro" type="button" id="sair">Sair</button>';
    modal.classList.add("on"); caixa.querySelector(".fechar").onclick = fecha; $("#mPed").onclick = fecha;
    $("#sair").onclick = function () { usuario = null; LS.set("usuario", null); fecha(); conta(); rota(); };
  };

  /* ---------- Busca, adicionar, rotas ---------- */
  var tb; $("#busca").addEventListener("input", function () { var v = this.value; clearTimeout(tb); tb = setTimeout(function () { filtro.busca = v; if (location.hash.indexOf("#/catalogo") !== 0) location.hash = "#/catalogo"; else telaCatalogo(); }, 180); });
  app.addEventListener("click", function (e) { var b = e.target.closest("[data-add]"); if (b) { var p = prod(b.dataset.add); adiciona(p.id, [], 1); } });
  function rota() {
    var h = location.hash.replace(/^#\/?/, "").split("/");
    window.scrollTo(0, 0);
    if (h[0] === "produto") telaProduto(h[1]);
    else if (h[0] === "carrinho") telaCarrinho();
    else if (h[0] === "checkout") telaCheckout();
    else if (h[0] === "pedido") telaPedido(h[1]);
    else if (h[0] === "acompanhar") telaAcompanhar();
    else { var c = new URLSearchParams(location.hash.split("?")[1] || "").get("cat"); if (c) filtro.cat = c; telaCatalogo(); }
    LS.set("rota", location.hash);
  }
  window.addEventListener("hashchange", rota);
  contador(); conta();
  if (!location.hash) { var r = LS.get("rota", null); if (r && typeof r === "string") location.hash = r; }
  rota();
})();
</script>
</body>
</html>
